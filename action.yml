name: 'CodeScene PR Refactoring Agent'
description: 'Automated code refactoring and code health improvements for pull requests'
branding:
  icon: 'code'
  color: 'orange'

inputs:
  pr_number:
    description: 'Pull request number (if running in PR context)'
    required: false
  command:
    description: 'The refactoring command to execute (e.g., "skill:fix-code-health-degradations")'
    required: true
  model:
    description: 'AI model to use (e.g., "anthropic/claude-sonnet-4-20250514")'
    required: true
  version:
    description: 'Version of refactoring-agent to use'
    required: false
    default: 'latest'
  github_token:
    description: 'GitHub token for API access and checkout'
    required: false
    default: ${{ github.token }}
  codescene_token:
    description: 'CodeScene API access token'
    required: true
  codescene_onprem_url:
    description: 'CodeScene On-prem URL (required for on-prem instances)'
    required: false
  anthropic_api_key:
    description: 'Anthropic API key (required for anthropic/* models)'
    required: false
  openai_api_key:
    description: 'OpenAI API key (required for openai/* models)'
    required: false
  google_api_key:
    description: 'Google API key (required for google/* models)'
    required: false
  opencode_auth_json:
    description: 'OpenCode auth JSON (required for github-copilot/* models)'
    required: false
  ca_bundle:
    description: 'Path to a custom CA certificate bundle (PEM format) for SSL/TLS verification. Required for on-prem CodeScene instances with custom certificates.'
    required: false
  print_logs:
    description: 'Print OpenCode logs into stdout'
    required: false
    default: false

runs:
  using: 'composite'
  steps:
    - name: Get PR metadata
      if: inputs.pr_number != ''
      id: pr
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const prNumber = parseInt('${{ inputs.pr_number }}');
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
          });

          core.setOutput('head_ref', pr.head.ref);
          core.setOutput('head_repo', pr.head.repo.full_name);
          core.setOutput('base_ref', pr.base.ref);
          core.setOutput('run_url', `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);

    - name: Checkout PR branch
      if: inputs.pr_number != ''
      uses: actions/checkout@v5
      with:
        repository: ${{ steps.pr.outputs.head_repo }}
        ref: ${{ steps.pr.outputs.head_ref }}
        token: ${{ inputs.github_token }}
        fetch-depth: 0
        clean: false

    - name: Configure git
      if: inputs.pr_number != ''
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout ${{ steps.pr.outputs.head_ref }}
        echo "Current branch: $(git branch --show-current)"
        echo "Current commit: $(git rev-parse HEAD)"

    - name: Determine platform
      id: platform
      shell: bash
      run: |
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64|amd64)
            echo "binary_name=refactoring-agent-linux-amd64" >> "$GITHUB_OUTPUT"
            ;;
          aarch64|arm64)
            echo "binary_name=refactoring-agent-linux-aarch64" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Unsupported architecture: $ARCH"
            exit 1
            ;;
        esac

    - name: Download refactoring-agent binary
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BINARY_NAME: ${{ steps.platform.outputs.binary_name }}
      run: |
        set -euo pipefail

        REPO="codescene-oss/refactoring-agent-releases"
        ASSET_NAME="${BINARY_NAME}.zip"

        mkdir -p "${RUNNER_TEMP}/refactoring-agent"
        cd "${RUNNER_TEMP}/refactoring-agent"

        if [ "$VERSION" = "latest" ]; then
          DOWNLOAD_URL="https://github.com/${REPO}/releases/latest/download/${ASSET_NAME}"
        else
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/${ASSET_NAME}"
        fi

        echo "Downloading from ${DOWNLOAD_URL}..."

        if ! curl -fsSL -o "${BINARY_NAME}.zip" "$DOWNLOAD_URL"; then
          echo "::error::Failed to download binary from ${DOWNLOAD_URL}"
          exit 1
        fi

        echo "✅ Successfully downloaded ${ASSET_NAME}"

        unzip -q "${BINARY_NAME}.zip"

        if [ -f "refactoring-agent" ]; then
          chmod +x refactoring-agent
        elif [ -f "$BINARY_NAME" ]; then
          mv "$BINARY_NAME" refactoring-agent
          chmod +x refactoring-agent
        else
          echo "::error::Could not find binary in archive"
          ls -la
          exit 1
        fi

        echo "${RUNNER_TEMP}/refactoring-agent" >> "$GITHUB_PATH"

    - name: Build agent config
      id: agent_config
      shell: bash
      env:
        CS_ACCESS_TOKEN: ${{ inputs.codescene_token }}
        CS_ONPREM_URL: ${{ inputs.codescene_onprem_url }}
        CS_PRINT_LOGS: ${{ inputs.print_logs }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        BASE_REF: ${{ steps.pr.outputs.base_ref }}
        GITHUB_RUN_URL: ${{ steps.pr.outputs.run_url }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GOOGLE_API_KEY: ${{ inputs.google_api_key }}
        OPENCODE_AUTH_JSON: ${{ inputs.opencode_auth_json }}
        CA_BUNDLE: ${{ inputs.ca_bundle }}
      run: |
        set -euo pipefail

        # Normalize opencode_auth JSON for OpenCode 1.17.4 compatibility
        AUTH_JSON="${OPENCODE_AUTH_JSON:-}"
        if [ -n "$AUTH_JSON" ]; then
          AUTH_JSON=$(jq '
            if type == "object" then
              with_entries(
                if .value | type == "object" then
                  if .value.type == null and .value.key != null then
                    .value = ({type: "api"} + .value)
                  else . end
                elif .value | type == "string" then
                  .value = {type: "api", key: .value}
                else . end
              )
            else . end' <<< "$AUTH_JSON" 2>/dev/null || printf '%s' "$AUTH_JSON")
        fi

        # Build CS_AGENT_CONFIG JSON using jq
        CONFIG=$(jq -n \
          --arg token "$CS_ACCESS_TOKEN" \
          --arg onprem "${CS_ONPREM_URL:-}" \
          --argjson print_logs "${CS_PRINT_LOGS:-false}" \
          --arg ca_bundle "${CA_BUNDLE:-}" \
          --arg gh_token "$GITHUB_TOKEN" \
          --arg gh_repo "$GITHUB_REPOSITORY" \
          --arg pr_num "${PR_NUMBER:-}" \
          --arg base_ref "$BASE_REF" \
          --arg run_url "$GITHUB_RUN_URL" \
          --arg anthropic_key "$(printf '%s' "${ANTHROPIC_API_KEY:-}" | tr -d '\n')" \
          --arg openai_key "$(printf '%s' "${OPENAI_API_KEY:-}" | tr -d '\n')" \
          --arg google_key "$(printf '%s' "${GOOGLE_API_KEY:-}" | tr -d '\n')" \
          --arg opencode_auth "$(printf '%s' "${AUTH_JSON:-}" | tr -d '\n')" \
          '{
            codescene_access_token: $token,
            print_logs: $print_logs,
            tracking: {
              environment: "github-action"
            },
            plugins: ["refactoring-reporter-apply", "github-pr-status-reporter"],
            provider: ({}
              + (if $anthropic_key != "" then { anthropic_api_key: $anthropic_key } else {} end)
              + (if $openai_key != "" then { openai_api_key: $openai_key } else {} end)
              + (if $google_key != "" then { google_api_key: $google_key } else {} end)
              + (if $opencode_auth != "" then { opencode_auth_json: $opencode_auth } else {} end))
          }
          + (if $onprem != "" then { codescene_onprem_url: $onprem } else {} end)
          + (if $ca_bundle != "" then { ca_bundle: $ca_bundle } else {} end)
          + (if $pr_num != "" then {
              git: { base_ref: $base_ref },
              ci: {
                github: {
                  token: $gh_token,
                  repository: $gh_repo,
                  pr_number: $pr_num,
                  run_url: $run_url
                }
              }
            } else {} end)')

        # Mask the config value in logs (it contains tokens)
        echo "::add-mask::${CONFIG}"

        # Use a delimiter to safely pass multi-line JSON
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "json<<${EOF}" >> "$GITHUB_OUTPUT"
        echo "$CONFIG" >> "$GITHUB_OUTPUT"
        echo "${EOF}" >> "$GITHUB_OUTPUT"

    - name: Run refactoring agent
      id: refactor
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        PR_NUMBER: ${{ inputs.pr_number }}
        MODEL: ${{ inputs.model }}
        CS_AGENT_CONFIG: ${{ steps.agent_config.outputs.json }}
        CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_KEY: ${{ env.CLOUDFLARE_API_KEY }}
      run: |
        set -euo pipefail

        config_backup=""
        created_config=false
        exclude_backup=""
        restore_config() {
          if [ "$created_config" = true ]; then
            rm -f opencode.json
            if [ -n "$exclude_backup" ] && [ -f "$exclude_backup" ]; then
              cp "$exclude_backup" "$exclude_path"
            fi
          fi
          if [ -n "$config_backup" ] && [ -f "$config_backup" ]; then
            cp "$config_backup" opencode.json
            git update-index --no-skip-worktree -- opencode.json
          fi
        }
        trap restore_config EXIT
        if [ -f opencode.json ] && jq -e '.mcp.servers | type == "object"' opencode.json >/dev/null 2>&1; then
          config_backup="${RUNNER_TEMP}/opencode-original.json"
          cp opencode.json "$config_backup"
          git update-index --skip-worktree -- opencode.json
          jq '.mcp = .mcp.servers | .mcp |= with_entries(.value.enabled = false)' "$config_backup" > opencode.json
        fi
        BINARY="${RUNNER_TEMP}/refactoring-agent/refactoring-agent"

        if [[ "$MODEL" == cloudflare-workers-ai/* ]]; then
          if [ -z "$config_backup" ] && [ -f opencode.json ]; then
            config_backup="${RUNNER_TEMP}/opencode-original.json"
            cp opencode.json "$config_backup"
            git update-index --skip-worktree -- opencode.json
          elif [ ! -f opencode.json ]; then
            exclude_path="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude_path")"
            touch "$exclude_path"
            exclude_backup="${RUNNER_TEMP}/opencode-exclude-original"
            cp "$exclude_path" "$exclude_backup"
            printf '\n/opencode.json\n' >> "$exclude_path"
            created_config=true
            printf '{}\n' > opencode.json
          fi

          cf_key="${CLOUDFLARE_API_KEY:-}"
          if [ -z "$cf_key" ]; then
            cf_key=$(jq -r '.provider.opencode_auth_json | fromjson | (if .["cloudflare-workers-ai"] | type == "object" then .["cloudflare-workers-ai"].key else .["cloudflare-workers-ai"] end) // empty' <<< "$CS_AGENT_CONFIG" 2>/dev/null || true)
          fi

          account_id="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -n "$account_id" ]; then
            jq --arg account "$account_id" --arg key "$cf_key" '
              .provider["cloudflare-workers-ai"].options.accountId = $account |
              .provider["cloudflare-workers-ai"].options.baseURL = ("https://api.cloudflare.com/client/v4/accounts/" + $account + "/ai/v1") |
              (if $key != "" then .provider["cloudflare-workers-ai"].options.apiKey = $key else . end)
            ' opencode.json > "${RUNNER_TEMP}/opencode-provider.json"
            cp "${RUNNER_TEMP}/opencode-provider.json" opencode.json
          fi
        fi

        # Commands without an explicit skill use the PR regression-repair workflow.
        FULL_COMMAND=$(printf '%s' "$COMMAND" | sed -E 's#^/[^[:space:]]+([[:space:]]+|$)##')
        if ! printf '%s' "$FULL_COMMAND" | grep -Eq '(^|[[:space:]])skill:[^[:space:]]+'; then
          FULL_COMMAND="skill:fix-code-health-degradations"
        fi

        ARGS=("run" "$FULL_COMMAND" "--model" "$MODEL" "--push")

        echo "Running: $BINARY ${ARGS[*]}"
        "$BINARY" "${ARGS[@]}"
